[project]
name = "training-hub"
version = "0.1.0"
description = "Syncs training and body data from wearable APIs to Databricks"
readme = "README.md"
authors = [
    { name = "Radosław Jasiewicz", email = "114445740+OptiNobles@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "truststore>=0.10.5",
]

[project.scripts]
training-hub-sync = "training_hub.jobs.daily_sync:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
