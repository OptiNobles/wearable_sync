[project]
name = "wearable-sync"
version = "0.1.0"
description = "Syncs training and body data from wearable APIs to Databricks"
readme = "README.md"
authors = [
    { name = "Radosław Jasiewicz", email = "114445740+OptiNobles@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "databricks-sdk>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "truststore>=0.10.5",
]

[project.scripts]
wearable-sync = "wearable_sync.jobs.daily_sync:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
# Single source of truth for the uv version: CI (setup-uv reads it) and the Docker
# build (the uv stage must provide this version) both follow it.
required-version = "==0.13.7"

[tool.pytest.ini_options]
# Every warning fails the tests, locally and in CI alike (e.g. a dependency's
# deprecation warning is a signal to act); add a targeted filter only if needed.
filterwarnings = ["error"]
